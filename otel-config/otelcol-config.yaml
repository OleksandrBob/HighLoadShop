receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

extensions:
  file_storage:
    directory: /etc/otelcol-contrib/.data/storage/
    create_directory: true

exporters:
  otlp_http:
    endpoint: http://loki:3100/otlp

service:
  extensions: [file_storage]
  pipelines:
    logs:
      receivers: [otlp]
      processors: []
      exporters: [otlp_http]
