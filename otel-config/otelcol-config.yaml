receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

extensions:
  file_storage:
    directory: /etc/otelcol-contrib/.data/storage/
    create_directory: true

processors:
  attributes:
    actions:
      - key: endpoint
        action: upsert
        from_attribute: ActionName
  resourcedetection:
    detectors: ["system"]

exporters:
  otlp_http:
    endpoint: http://loki:3100/otlp

service:
  extensions: [file_storage]
  pipelines:
    logs:
      receivers: [otlp]
      processors: [attributes, resourcedetection]
      exporters: [otlp_http]
